<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tissue Pressure Interpreter ZHL-16C (Shearwater)</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="top-bar">
            <section class="left-section">
                <button type="button" id="importBtn">Import CSV Log...</button>
                <input type="file" id="fileInput" accept=".csv">
                <span class="file-label" id="fileLabel">No file loaded</span>
            </section>

            <section class="middle-section">
                <h1 class="title">Tissue Pressure Interpreter ZHL-16C (Shearwater)</h1>
                <div class="control-buttons">
                    <button type="button" id="playPauseBtn" disabled>Play</button>
                    <button type="button" id="restartBtn" disabled>Restart</button>
                    <button type="button" id="scaleBtn" disabled>Fix Scale</button>
                    <button type="button" id="demoBtn">Use Demo Data</button>
                    <button type="button" id="demoBtnEAN32">Use Demo Data (EAN32)</button>
                </div>
                <span class="status-text" id="statusText" aria-live="polite">Load a CSV to begin.</span>
            </section>

            <nav class="right-section" aria-label="Playback speed">
                <div class="speed-buttons">
                    <button type="button" class="speed-btn" data-delay="10">Very Fast</button>
                    <button type="button" class="speed-btn" data-delay="20">Fast</button>
                    <button type="button" class="speed-btn active" data-delay="100">Normal</button>
                    <button type="button" class="speed-btn" data-delay="200">Slow</button>
                    <button type="button" class="speed-btn" data-delay="500">Very Slow</button>
                </div>
            </nav>
        </header>

        <main class="main-display">
            <canvas id="tissueCanvas" role="img" aria-label="ZHL-16C tissue pressure visualization"></canvas>
        </main>

        <aside class="bottom-area" aria-label="Dive details">
            <section class="settings-panel">
                <div class="settings-info" id="settingsPanel">
                    <p>Dive computer settings will appear here after import.</p>
                </div>
                <section class="metrics-display" id="metricsDisplay" style="display: none;" aria-label="Dive metrics">
                    <div class="metric-item">
                        <div class="metric-label">Ceiling</div>
                        <div class="metric-value" id="ceilingValue">--</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">NDL</div>
                        <div class="metric-value" id="ndlValue">--</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">TTS</div>
                        <div class="metric-value" id="ttsValue">--</div>
                    </div>
                </section>
            </section>
            <section class="depth-graph" id="depthGraph">
                <canvas id="depthCanvas" role="img" aria-label="Depth versus time graph"></canvas>
            </section>
        </aside>
    </div>
</body>
</html>
